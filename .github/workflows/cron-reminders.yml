name: Subscription Reminders Cron

on:
  schedule:
    # Запуск каждый час на 0-й минуте для охвата времени отправки (11:00) в разных часовых поясах
    - cron: '0 * * * *'
  # Возможность ручного вызова из интерфейса GitHub Actions
  workflow_dispatch:

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminders Endpoint
        run: |
          curl -s -f -X GET "https://tg-app-finace.pages.dev/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
